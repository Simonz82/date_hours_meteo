name: Feature request
description: Suggest an improvement or a new option
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: alt
    attributes:
      label: Alternatives you considered (optional)
